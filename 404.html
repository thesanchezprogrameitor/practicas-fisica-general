  <style>
    .perdido {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      align-content: center;
      gap: 1.6rem;
      padding: var(--gutter);
      overflow: hidden;
      isolation: isolate;
    }
    .perdido::before {
      content: "";
      position: absolute; inset: 0; z-index: -1;
      background-image:
        linear-gradient(var(--linea) 1px, transparent 1px),
        linear-gradient(90deg, var(--linea) 1px, transparent 1px);
      background-size: 96px 96px;
      -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
      mask-image: radial-gradient(ellipse 70% 60% at 50% 45%, #000 20%, transparent 75%);
    }
    .perdido h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(5rem, 22vw, 18rem);
      line-height: 0.85;
      letter-spacing: -0.03em;
    }
    .perdido h1 em { color: var(--acento); }
    .perdido p { max-width: 40ch; font-size: clamp(1.1rem, 2vw, 1.5rem); color: var(--papel-2); }
    .perdido a {
      justify-self: start;
      padding: 0.8em 1.6em;
      border-radius: 100px;
      background: var(--acento);
      color: var(--tinta);
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.3s var(--ease-out);
    }
    .perdido a:hover { transform: scale(1.05); }
  </style>
</head>
